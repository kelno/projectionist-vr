# The Python side: the scripts in scripts/, which generate the catalogue and
# thumbnails and prepare media. They use only the standard library, so running
# them needs nothing but Python; this file sets which Python, and the tools to
# check them while developing: `uv run ruff check`, `uv run ruff format`,
# `uv run basedpyright`. The project's version lives in package.json.

[project]
name = "projectionist-vr"
version = "0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "ruff>=0.15.15",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 160
src = ["scripts"]

[tool.ruff.lint]
# Errors, bugs, imports, modern syntax, simplifications.
select = ["E", "F", "W", "B", "I", "UP", "SIM", "PTH", "RUF"]

[tool.basedpyright]
include = ["scripts"]
extraPaths = ["scripts"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
